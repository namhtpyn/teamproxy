name: CI

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/namhtpyn/teamproxy:${{ github.sha }}
            ghcr.io/namhtpyn/teamproxy:main

      - uses: ./.github/actions/deploy-to-portainer
        with:
          portainer-url: ${{ vars.PORTAINER_URL }}
          portainer-access-token: ${{ secrets.PORTAINER_ACCESS_TOKEN }}
          portainer-endpoint-id: ${{ vars.PORTAINER_ENDPOINT_ID }}
          stack-name: team-proxy
          image-tag: ${{ github.sha }}
          template-file: .github/workflows/portainer/production.yml
          container-env: >-
            {
              "VIRTUAL_HOST": "${{ vars.APP_DOMAIN }}",
              "LETSENCRYPT_HOST": "${{ vars.APP_DOMAIN }}",
              "NUXT_APP_ADMIN": "${{ secrets.NUXT_APP_ADMIN }}",
              "NUXT_APP_USER": "${{ secrets.NUXT_APP_USER }}",
              "NUXT_MS_CLIENT_ID": "${{ vars.NUXT_MS_CLIENT_ID }}",
              "NUXT_MS_CLIENT_SECRET": "${{ secrets.NUXT_MS_CLIENT_SECRET }}",
              "NUXT_MS_TENANT_ID": "${{ vars.NUXT_MS_TENANT_ID }}",
              "NUXT_ENCRYPTION_KEY": "${{ secrets.NUXT_ENCRYPTION_KEY }}"
            }
          insecure: 'true'

      - name: Health check
        run: |
          echo "Waiting for deployment to settle..."
          sleep 30
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "https://${{ vars.APP_DOMAIN }}" || true)
          if [ "$STATUS" = "200" ]; then
            echo "✅ Health check passed (HTTP $STATUS)"
          else
            echo "❌ Health check failed (HTTP $STATUS)"
            exit 1
          fi
