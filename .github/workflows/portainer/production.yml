services:
  app:
    image: ghcr.io/namhtpyn/teamproxy:${IMAGE_TAG:-latest}
    restart: unless-stopped
    volumes:
      - app_data:/app/data
    env_file: stack.env
    environment:
      NUXT_DATABASE_URL: /app/data/local.db
    networks:
      - nginx-proxy

volumes:
  app_data:

networks:
  nginx-proxy:
    external: true
